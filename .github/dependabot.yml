# Dependabot configuration.
#
# Weekly version updates per ecosystem, with minor/patch releases grouped into
# one PR per ecosystem so the queue stays reviewable. Majors open as their own
# PRs, except crates that only build when bumped together (grouped below) and
# majors that are planned migrations (ignored below, with the reason). Security
# updates are separate and are enabled in the repository's Security settings
# (Dependabot alerts + security updates).
version: 2

updates:
  # ── GitHub Actions (every workflow under .github/workflows) ─────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # ── npm (pnpm workspace: client, backend, landing, shared-types) ─────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      # @vitejs/plugin-react 6 imports vite 7 internals, so the two majors
      # only build together.
      vite:
        patterns: ["vite", "@vitejs/*"]
        update-types: ["major"]
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # Planned migrations, not drop-in bumps: zod 4 and tiptap 3 change their
    # APIs, astro 7 moves the landing site's sharp/vite with it, and
    # @noble/curves 2 renames its subpaths (`/secp256k1` → `/secp256k1.js`) and
    # drops hex inputs across the published core package and the client. The
    # @types/node major follows the Node runtime (`node:22-slim` images, CI
    # `node-version: 22`), like the Docker rule below.
    ignore:
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tiptap/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: astro
        update-types: ["version-update:semver-major"]
      - dependency-name: "@astrojs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@noble/curves"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  # ── Cargo: relay + Tauri shell ───────────────────────────────────────────
  # The `crypto` groups come first so these crates never land in the
  # minor/patch group: the RustCrypto crates share one `digest`/`cipher`
  # generation and secp256k1 pins its `rand` major, so a lone bump of any of
  # them does not compile.
  - package-ecosystem: cargo
    directory: /services/relay
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      crypto:
        patterns: ["sha2", "secp256k1", "rand"]
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    # sqlx 0.9 changes the query/migrate API the relay is written against; a
    # deliberate migration, not a weekly bump.
    ignore:
      - dependency-name: sqlx
        versions: [">= 0.9.0"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: cargo
    directory: /client/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      crypto:
        patterns: ["sha2", "hmac", "hkdf", "chacha20", "secp256k1", "rand"]
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    # rfd stays on the version tauri-plugin-dialog uses, so the tree carries
    # one copy; raise both together.
    ignore:
      - dependency-name: rfd
        versions: [">= 0.17.0"]
    commit-message:
      prefix: chore(deps)

  # ── Go: gateway ──────────────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /services/gateway
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore(deps)

  # ── Docker base images ───────────────────────────────────────────────────
  - package-ecosystem: docker
    directories:
      - /services/backend
      - /services/gateway
      - /services/relay
      - /services/proxy
      - /services/landing
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    # The Node major in the images moves together with CI's node-version, so
    # tests always run on the runtime that ships.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(docker)
