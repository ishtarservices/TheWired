name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Client Tests (Vitest) ───────────────────────
  client:
    name: Client Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run client tests
        run: pnpm test:client

      - name: Run client tests with coverage
        if: github.event_name == 'pull_request'
        run: pnpm test:client:coverage

  # ── Gateway Tests (Go) ─────────────────────────
  gateway:
    name: Gateway Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: services/gateway/go.sum

      # GOTOOLCHAIN=local matches the golang builder image: a dependency that
      # raises the go directive past this version fails here instead of being
      # tested on a silently downloaded newer toolchain and then failing the
      # image build after merge.
      - name: Run gateway tests
        working-directory: services/gateway
        env:
          GOTOOLCHAIN: local
        run: go test ./... -v -count=1

  # ── Relay Tests (Rust + PostgreSQL) ────────────
  relay:
    name: Relay Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thewired
          POSTGRES_PASSWORD: thewired
          POSTGRES_DB: thewired_relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: services/relay

      - name: Run relay tests
        working-directory: services/relay
        run: cargo test
        env:
          TEST_DATABASE_URL: postgres://thewired:thewired@localhost:5432/thewired_relay_test

  # ── Tauri shell (Rust) ─────────────────────────
  # Compiles the desktop shell (and the embedded relay it links) so dependency
  # bumps under client/src-tauri are checked before merge, and runs the NIP-44
  # vectors that exercise its crypto crates. The keystore tests need an OS
  # keychain and are left to local runs.
  tauri:
    name: Tauri Shell Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: client/src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      # generate_context! needs frontendDist to exist; the shell compiles
      # against an empty one, the web build is not under test here. The second
      # check builds the release configuration (`tauri build` turns on
      # custom-protocol), which compiles the `cfg(not(dev))` code paths.
      - name: Check and run NIP-44 tests
        working-directory: client/src-tauri
        run: |
          mkdir -p ../dist
          cargo check --locked --all-targets
          cargo check --locked --features tauri/custom-protocol
          cargo test --locked --lib nip44::

  # ── Backend Tests (Vitest + PostgreSQL) ─────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thewired
          POSTGRES_PASSWORD: thewired
          POSTGRES_DB: thewired_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create DB schemas
        run: |
          PGPASSWORD=thewired psql -h localhost -U thewired -d thewired_test -c "CREATE SCHEMA IF NOT EXISTS app; CREATE SCHEMA IF NOT EXISTS relay;"

      - name: Run backend tests
        run: pnpm test:backend
        env:
          DATABASE_URL: postgres://thewired:thewired@localhost:5432/thewired_test
          TEST_DATABASE_URL: postgres://thewired:thewired@localhost:5432/thewired_test
          REDIS_URL: redis://localhost:6380/1
          NODE_ENV: test

  # ── Typecheck ──────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ── Supply-chain audit ─────────────────────────
  # Blocking: workflow hygiene + critical npm advisories in production deps.
  # Informational (continue-on-error): the full npm report, cargo audit for
  # both crates and govulncheck for the gateway, so the signal is in every run
  # without upstream advisory noise red-blocking merges.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check third-party actions are pinned to commit SHAs
        run: |
          set -euo pipefail
          # Every non-local `uses:` must reference a full 40-hex commit SHA.
          if grep -rnE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[^./[:space:]][^@[:space:]]*@' .github/workflows \
               | grep -vE '@[0-9a-f]{40}([[:space:]]|$)'; then
            echo "::error::the actions above are not pinned to a commit SHA"
            exit 1
          fi
          echo "all third-party actions are SHA-pinned"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Known exception, tracked for removal:
      #   GHSA-26w7-cxv4-gfx2 - astro AVIF image optimisation RCE. Build-time
      #   only (the landing site is prerendered; nothing user-supplied reaches
      #   the image pipeline) and the fix is in a new astro major. Drop the
      #   --ignore once the landing moves to astro >= 7.2.8.
      - name: npm audit (production deps, blocking at critical)
        run: pnpm audit --prod --audit-level=critical --ignore GHSA-26w7-cxv4-gfx2

      - name: npm audit (full report, informational)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=moderate

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            services/relay
            client/src-tauri
          cache-bin: true

      - name: cargo audit (relay + tauri shell, informational)
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          echo "::group::services/relay"
          (cd services/relay && cargo audit)
          echo "::endgroup::"
          echo "::group::client/src-tauri"
          (cd client/src-tauri && cargo audit)
          echo "::endgroup::"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: services/gateway/go.sum

      - name: govulncheck (gateway, informational)
        continue-on-error: true
        working-directory: services/gateway
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
