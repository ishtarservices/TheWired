# Local development stack. Every host port is bound to 127.0.0.1 (set the
# *_BIND variables to 0.0.0.0 to reach a service from another machine):
# Postgres, Redis, Meilisearch, the relay, the backend (which trusts the
# gateway's identity header) and LiveKit (dev keys) have no business on the LAN.
# Only Caddy publishes 80/443.
networks:
  frontend:
  backend:

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thewired}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-thewired}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thewired}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-6380}:6379"
    # REDIS_PASSWORD set → requirepass is on and the in-network REDIS_URLs below
    # carry it; the native backend/gateway then need redis://:<pw>@localhost:6380.
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD} --no-auth-warning} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  meilisearch:
    image: getmeili/meilisearch:v1.6
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MEILI_PORT:-7700}:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
      MEILI_ENV: ${MEILI_ENV:-development}
    volumes:
      - meilidata:/meili_data
    healthcheck:
      # Use 127.0.0.1, not "localhost": inside the container "localhost" resolves to
      # IPv6 [::1] first, where Meilisearch (IPv4, 0.0.0.0:7700) isn't listening -> refused.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  relay:
    build:
      context: ./services/relay
      dockerfile: Dockerfile
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${RELAY_PORT:-7777}:7777"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-thewired}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-thewired}
      RELAY_PORT: 7777
      RELAY_NAME: ${RELAY_NAME:-The Wired Relay}
      RELAY_SECRET_KEY: ${RELAY_SECRET_KEY:-}
      RELAY_URL: ${RELAY_URL:-ws://localhost:7777}
      RUST_ENV: ${RUST_ENV:-development}
      RUST_LOG: ${RUST_LOG:-info,thewired_relay=debug}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7777/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - backend

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-3002}:3002"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-thewired}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-thewired}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY:?err}
      RELAY_URL: ws://relay:7777
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:9080}
      ADMIN_PUBKEYS: ${ADMIN_PUBKEYS:-}
      REPORT_WEBHOOK_URL: ${REPORT_WEBHOOK_URL:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env (openssl rand -base64 32)}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      GIF_API_KEY: ${GIF_API_KEY:-}
      BLOB_DIR: /app/blobs
      MAX_BLOB_SIZE: ${MAX_BLOB_SIZE:-104857600}
      # Media storage (docs/MEDIA_STORAGE.md): read gate for space-scoped blobs
      # (off | log | enforce), extra BUD-11 server names, upload guard.
      SPACE_MEDIA_GATE: ${SPACE_MEDIA_GATE:-log}
      # Unlisted-space reads for non-members (off | log | enforce).
      SPACE_READ_GATE: ${SPACE_READ_GATE:-log}
      BLOSSOM_SERVER_NAMES: ${BLOSSOM_SERVER_NAMES:-}
      UPLOAD_RATE_PER_MIN: ${UPLOAD_RATE_PER_MIN:-30}
      UPLOAD_DAILY_BYTES: ${UPLOAD_DAILY_BYTES:-2147483648}
      # Gateway-signed identity headers (same secret as the gateway below);
      # off = trust X-Auth-Pubkey as before, warn = log mismatches, enforce = drop.
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-}
      GATEWAY_AUTH_MODE: ${GATEWAY_AUTH_MODE:-off}
      # Which hops may set X-Forwarded-For (default: loopback + RFC1918).
      TRUST_PROXY: ${TRUST_PROXY:-}
    volumes:
      - blobdata:/app/blobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      relay:
        condition: service_started
      meilisearch:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GATEWAY_PORT:-9080}:9080"
    environment:
      GATEWAY_PORT: 9080
      BACKEND_URL: http://backend:3002
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-}
      # NIP-98 payload tag on body-bearing /api requests: off | warn | enforce
      NIP98_REQUIRE_PAYLOAD: ${NIP98_REQUIRE_PAYLOAD:-off}
      # GATEWAY_ENV=production flips TRUSTED_PROXIES to "trust nobody" and CORS
      # to deny-by-default; dev keeps the private-range / "*" defaults.
      GATEWAY_ENV: ${GATEWAY_ENV:-${NODE_ENV:-development}}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      RATE_LIMIT_IP_PER_MIN: ${RATE_LIMIT_IP_PER_MIN:-1200}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - frontend
      - backend

  # NOTE: Docker Desktop on macOS has known UDP port-forwarding issues that
  # prevent LiveKit media from working reliably. For Mac development, run
  # LiveKit natively instead of in Docker:
  #   brew install livekit
  #   livekit-server --dev
  # Then comment out this service or stop it with `docker stop <container>`.
  #
  # LIVEKIT_NODE_IP defaults to the host's LAN IP for Linux hosts where
  # Docker UDP works. On Mac, set it to your LAN IP (e.g. 192.168.1.x) only
  # if you absolutely must keep LiveKit in Docker (and then BIND_ADDR=0.0.0.0
  # so the media ports are reachable from the LAN).
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${LIVEKIT_PORT:-7880}:7880"
      - "${BIND_ADDR:-127.0.0.1}:7881:7881"
      - "${BIND_ADDR:-127.0.0.1}:7882:7882/udp"
    environment:
      # The signaling endpoint mints nothing by itself, but anyone who knows the
      # key pair can mint room tokens: no "secret" default, even in dev.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env (openssl rand -base64 32)}"
      LIVEKIT_LOG_LEVEL: info
    command: --dev --bind 0.0.0.0 ${LIVEKIT_NODE_IP:+--node-ip=${LIVEKIT_NODE_IP}}
    restart: unless-stopped
    networks:
      - backend

  landing:
    build:
      context: .
      dockerfile: services/landing/Dockerfile
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${LANDING_PORT:-8080}:8080"
    networks:
      - frontend

  proxy:
    build:
      context: ./services/proxy
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
      landing:
        condition: service_started
    restart: unless-stopped
    networks:
      - frontend
      - backend

volumes:
  pgdata:
  meilidata:
  redisdata:
  blobdata:
  caddy_data:
  caddy_config:
