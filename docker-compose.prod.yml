networks:
  frontend:
  backend:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thewired}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-thewired}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thewired}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512m

  meilisearch:
    image: getmeili/meilisearch:v1.6
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
      MEILI_ENV: production
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512m

  relay:
    image: ghcr.io/ishtarservices/thewired-relay:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-thewired}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-thewired}
      RELAY_PORT: 7777
      RELAY_NAME: ${RELAY_NAME:-The Wired Relay}
      RELAY_SECRET_KEY: ${RELAY_SECRET_KEY:?Set RELAY_SECRET_KEY in .env}
      RUST_ENV: production
      RUST_LOG: ${RUST_LOG:-info,thewired_relay=info}
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7777/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512m

  backend:
    image: ghcr.io/ishtarservices/thewired-backend:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-thewired}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-thewired}
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY:?err}
      RELAY_URL: ws://relay:7777
      PORT: 3002
      NODE_ENV: production
      LOG_LEVEL: info
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://thewired.app,tauri://localhost,http://localhost}
      PUBLIC_URL: ${PUBLIC_URL:-https://api.thewired.app}
      ADMIN_PUBKEYS: ${ADMIN_PUBKEYS:-}
      # Share pages (thewired.app/music/*, /profile/*) + mobile universal links
      # (/.well-known/apple-app-site-association, assetlinks.json). Compose only
      # forwards variables listed here — an .env entry alone never reaches the
      # container. Store URLs empty → the landing page's #download section.
      WEB_BASE_URL: ${WEB_BASE_URL:-https://thewired.app}
      APPLE_APP_IDS: ${APPLE_APP_IDS:-53RG2QV7HT.app.soot.mobile}
      ANDROID_PACKAGE_NAME: ${ANDROID_PACKAGE_NAME:-app.soot.mobile}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      IOS_APP_URL: ${IOS_APP_URL:-}
      ANDROID_APP_URL: ${ANDROID_APP_URL:-}
      DESKTOP_APP_URL: ${DESKTOP_APP_URL:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      GIF_API_KEY: ${GIF_API_KEY:-}
      BLOB_DIR: /app/blobs
      MAX_BLOB_SIZE: ${MAX_BLOB_SIZE:-104857600}
      # Signs the ?tk= tokens for protected music (blob + HLS). The backend
      # refuses to mint with an empty secret under NODE_ENV=production, so a
      # missing value = every private/space track fails to play. Required.
      MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET:?Set MEDIA_TOKEN_SECRET (openssl rand -hex 32)}
      # Transcoding pipeline — both flags on by default. Roll back by setting
      # either to "false" in .env and redeploying; the client falls back to the
      # original blob URL when HLS variants are missing.
      TRANSCODE_ENQUEUE: ${TRANSCODE_ENQUEUE:-true}
      TRANSCODE_WORKER: ${TRANSCODE_WORKER:-true}
      # Default 1 so one vCPU stays free for Fastify under steady load.
      # Bump to 2 only during deliberate backfill windows (and watch CPU credits).
      TRANSCODE_CONCURRENCY: ${TRANSCODE_CONCURRENCY:-1}
    volumes:
      - blobdata:/app/blobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      relay:
        condition: service_started
      meilisearch:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1536m

  gateway:
    image: ghcr.io/ishtarservices/thewired-gateway:latest
    environment:
      GATEWAY_PORT: 9080
      BACKEND_URL: http://backend:3002
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://thewired.app,tauri://localhost,http://localhost}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 256m

  livekit:
    image: livekit/livekit-server:latest
    # The whole config is passed inline so compose interpolates the secrets
    # (a mounted config/livekit.yaml would NOT be interpolated). See
    # docs/PRODUCTION.md §8.4 for the networking rationale.
    environment:
      LIVEKIT_LOG_LEVEL: info
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          # One muxed UDP port + ICE over TCP for networks that block UDP.
          udp_port: 7882
          tcp_port: 7881
          use_external_ip: true
          # Publicly reachable IP of this host — REQUIRED. With 127.0.0.1
          # every client fails ICE ("connecting forever", silent calls).
          node_ip: ${LIVEKIT_NODE_IP:?Set LIVEKIT_NODE_IP to this host's public IP}
        turn:
          # Embedded TURN for symmetric-NAT clients (hotel/corporate Wi-Fi).
          # UDP relay only; TLS TURN on 443 needs a dedicated IP + cert
          # (see PRODUCTION.md §8.4) and is a follow-up.
          enabled: true
          domain: ${LIVEKIT_TURN_DOMAIN:-turn.thewired.app}
          udp_port: 3478
        keys:
          ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}
        room:
          max_participants: 100
          empty_timeout: 300
        logging:
          level: info
    command: --bind 0.0.0.0
    ports:
      - "7881:7881/tcp"   # ICE/TCP fallback
      - "7882:7882/udp"   # WebRTC media (muxed)
      - "3478:3478/udp"   # TURN relay
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512m

  landing:
    image: ghcr.io/ishtarservices/thewired-landing:latest
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 64m

  proxy:
    image: ghcr.io/ishtarservices/thewired-proxy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
      landing:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend

volumes:
  pgdata:
  meilidata:
  redisdata:
  blobdata:
  caddy_data:
  caddy_config:
